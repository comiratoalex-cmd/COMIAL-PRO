<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>COMIAL PRO — Transition</title>

<link rel="stylesheet" href="../obs.css">

<style>
#transition {
    width: 100vw;
    height: 100vh;
    position: fixed;
    top: 0; left: 0;
    background: black;
    opacity: 0;
    animation: sweep 1.2s ease-in-out forwards;
}

@keyframes sweep {
    0% { opacity: 0; clip-path: circle(0% at 50% 50%); }
    40% { opacity: 1; clip-path: circle(120% at 50% 50%); }
    100% { opacity: 0; clip-path: circle(0% at 50% 50%); }
}
</style>

</head>

<body>

<div id="transition"></div>

<script src="../ai/themes-ai.js"></script>

<script>
const theme = generateAITheme();

document.getElementById("transition").style.background =
`radial-gradient(circle,
${theme.c1},
${theme.c2},
${theme.c3},
${theme.c4})`;
</script>

</body>
</html>
