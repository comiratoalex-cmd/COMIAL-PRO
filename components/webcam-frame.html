<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>COMIAL PRO — Webcam Frame</title>

<link rel="stylesheet" href="../obs.css">
<link rel="stylesheet" href="../fx/glass.css">
<link rel="stylesheet" href="../fx/double.css">
<link rel="stylesheet" href="../fx/tokyo.css">

<style>
#webcamFrame {
    width: 100%;
    height: 100%;
    position: relative;

    border: 6px solid transparent;
    border-radius: 22px;
    background: transparent;

    animation: gradientFlow 6s linear infinite;
}

@keyframes gradientFlow {
    0% { filter: hue-rotate(0deg) }
    100% { filter: hue-rotate(360deg) }
}
</style>
</head>

<body>

<div id="webcamFrame"></div>

<script src="../ai/smart-color.js"></script>
<script src="../ai/adaptive-glow.js"></script>
<script src="../ai/themes-ai.js"></script>

<script src="../fx/particles.js"></script>
<script src="../engine/layers.js"></script>
<script src="../engine/renderer.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

let theme = null;

try {
    theme = JSON.parse(params.get("theme"));
} catch (e) {}

if (theme) {
    const f = document.getElementById("webcamFrame");

    f.style.border = "6px solid transparent";
    f.style.borderRadius = "22px";

    f.style.backgroundImage = `
        linear-gradient(90deg,
        ${theme.c1},
        ${theme.c2},
        ${theme.c3},
        ${theme.c4},
        ${theme.c1})
    `;

    // Glass
    if (params.get("glass") === "1") {
        f.classList.add("glass-effect");
    }

    // Double Border
    if (params.get("double") === "1") {
        f.classList.add("double-border");
    }

    // Tokyo Glow
    if (params.get("tokyo") === "1") {
        f.style.setProperty("--tokyo-color", theme.glow);
        f.classList.add("tokyo-breath");
    }

    // Particles
    if (params.get("particles") === "1") {
        startParticles(theme);
    }
}
</script>

</body>
</html>
