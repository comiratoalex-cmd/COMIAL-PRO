<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>COMIAL PRO OBS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #border {
      position: fixed;
      inset: 20px;
      border-radius: 16px;
      border: 6px solid transparent;
      background:
        linear-gradient(#0000, #0000) padding-box,
        linear-gradient(90deg, cyan, magenta) border-box;
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      to { filter: hue-rotate(360deg); }
    }
  </style>
</head>

<body>

  <div id="border"></div>

</body>

</html>
