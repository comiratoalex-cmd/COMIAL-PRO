<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>COMIAL PRO — TESTE VISUAL</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  background: black;
}

/* PREVIEW */
#preview {
  position: relative;
  width: 100%;
  height: 100%;
  background: #111;
}

/* BORDA FORÇADA */
#border {
  position: absolute;
  inset: 50px;

  /* ISSO É IMPOSSÍVEL NÃO APARECER */
  border: 10px solid red;

  z-index: 9999;
}
</style>
</head>

<body>

<div id="preview">
  <div id="border"></div>
</div>

</body>
</html>
