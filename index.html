<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>COMIAL PRO — Neon Engine Extreme</title>

    <!-- CSS PRINCIPAL -->
    <link rel="stylesheet" href="style.css">

    <!-- EFEITOS -->
    <link rel="stylesheet" href="fx/glass.css">
    <link rel="stylesheet" href="fx/double.css">
    <link rel="stylesheet" href="fx/tokyo.css">
</head>

<body>

<!-- BOTÃO MOBILE -->
<button id="mobileToggle" class="mobile-toggle">☰</button>

<!-- SIDEBAR -->
<div class="sidebar">

    <h1 class="logo">COMIAL<span>PRO</span></h1>

    <!-- IA: GERAR TEMA -->
    <div class="module glass-panel">
        <h2 class="module-title">🎨 Gerador IA (Cores)</h2>

        <button id="generateAI" class="btn">Gerar Tema IA</button>

        <div id="themePreview" class="theme-preview"></div>
    </div>

    <!-- PRESETS PRO -->
    <div class="module glass-panel">
        <h2 class="module-title">🎛️ Presets PRO</h2>

        <div id="presetsGrid" class="presets-grid"></div>

        <button id="randomTokyo" class="btn">🎌 Tokyo Aleatório</button>
        <button id="randomVapor" class="btn">🌅 Vaporwave</button>
        <button id="randomGold" class="btn">✨ Gold Luxury</button>
    </div>

    <!-- CONTROLE DA BORDA -->
    <div class="module glass-panel">
        <h2 class="module-title">🖼 Bordas</h2>

        <label>Forma</label>
        <select id="shape">
            <option value="rect">Retângulo</option>
            <option value="square">Quadrado</option>
            <option value="line-h">Linha Horizontal</option>
            <option value="line-v">Linha Vertical</option>
        </select>

        <label>Espessura</label>
        <input type="range" id="stroke" min="1" max="30" value="6">

        <label>Raio</label>
        <input type="range" id="radius" min="0" max="80" value="18">

        <label>Velocidade</label>
        <input type="range" id="speed" min="1" max="30" value="12">
    </div>

    <!-- EFEITOS -->
    <div class="module glass-panel">
        <h2 class="module-title">✨ Efeitos</h2>

        <label><input type="checkbox" id="fxGlass"> Glass Effect</label>
        <label><input type="checkbox" id="fxDouble"> Borda Dupla</label>
        <label><input type="checkbox" id="fxTokyo"> Tokyo Glow</label>
        <label><input type="checkbox" id="fxParticles"> Partículas</label>
    </div>

    <!-- EXPORTAÇÃO -->
    <div class="module glass-panel">
        <h2 class="module-title">🔗 Export</h2>

        <button id="exportViewer" class="btn">Gerar Link Viewer</button>
        <input id="viewerLink" class="output" readonly>

        <button id="exportOBS" class="btn">Gerar Link OBS</button>
        <input id="obsLink" class="output" readonly>

        <button id="exportPack" class="btn btn-pro">GERAR PACK COMPLETO</button>
    </div>

</div>

<!-- ÁREA DE PREVIEW -->
<div class="preview-area">
    <div id="preview"></div>
</div>

<!-- ============================================================
     IA SCRIPTS (CAMINHOS CORRIGIDOS)
============================================================ -->
<script src="themes-ai.js"></script>
<script src="smart-color.js"></script>
<script src="adaptive-glow.js"></script>

<!-- FX -->
<script src="fx/particles.js"></script>

<!-- ENGINE -->
<script src="engine/layers.js"></script>
<script src="engine/renderer.js"></script>

<!-- PRESETS -->
<script src="presets.js"></script>

<!-- CONTROLADOR PRINCIPAL -->
<script src="script.js"></script>

<!-- EXPORT PACK -->
<script src="exporter.js"></script>

<!-- MOBILE MENU -->
<script>
document.getElementById("mobileToggle").onclick = () => {
    document.querySelector(".sidebar").classList.toggle("open");
};
</script>

</body>
</html>
