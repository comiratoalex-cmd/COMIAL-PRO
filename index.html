<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>COMIAL PRO — Overlay Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONTES -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS PRINCIPAL -->
  <link rel="stylesheet" href="style.css">

  <!-- VARIÁVEIS DEFAULT -->
  <style>
    :root{
      --c1:#a855f7;
      --c2:#22d3ee;
      --c3:#fb7185;
      --c4:#fcd34d;
    }
    body{
      margin:0;
      font-family:'Montserrat',sans-serif;
      background:#000;
      color:#fff;
      overflow:hidden;
    }
  </style>
</head>

<body>

  <!-- CANVAS FUNDO -->
  <canvas id="bgCanvas"></canvas>

  <!-- LAYOUT -->
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h1 class="logo">COMIAL <span>PRO</span></h1>

      <!-- GERADOR IA -->
      <section class="panel">
        <h3>🎨 Gerador IA (Cores)</h3>
        <button id="generateAI" class="btn primary">Gerar Tema IA</button>
        <div id="themePreview" class="preview"></div>
      </section>

      <!-- PRESETS -->
      <section class="panel">
        <h3>💎 Presets PRO</h3>
        <div id="presetsGrid" class="preset-grid"></div>
      </section>

      <!-- EXPORT -->
      <section class="panel">
        <h3>📤 Exportar</h3>

        <button id="exportViewer" class="btn">Gerar Link Viewer</button>
        <input id="viewerLink" class="input" readonly>

        <button id="exportOBS" class="btn">Gerar Link OBS</button>
        <input id="obsLink" class="input" readonly>

        <button id="exportPack" class="btn secondary">Exportar Pack</button>
      </section>
    </aside>

    <!-- ÁREA PREVIEW GRANDE -->
    <main class="preview-area">
      <div class="frame">
        <span>Overlay ativo</span>
      </div>
    </main>

  </div>

  <!-- SCRIPT -->
  <script src="script.js" defer></script>

</body>
</html>
